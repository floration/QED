name: auto-merge-verified
# Runs in the base repo after verify-solution finishes. It never checks out or runs PR code.
on:
  workflow_run:
    workflows: [verify-solution]
    types: [completed]
permissions: { contents: write, pull-requests: write, actions: write }
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find the PR, re-check it only adds solution files, merge, rebuild board
        run: |
          PR=$(gh api "repos/$R/pulls?state=open&per_page=100" --jq ".[] | select(.head.sha==\"$SHA\") | .number" | head -1)
          [ -z "$PR" ] && { echo "No open PR at $SHA"; exit 0; }
          BAD=$(gh api "repos/$R/pulls/$PR/files?per_page=100" --jq '.[] | select(.status!="added" or (.filename | test("^solutions/N-[0-9]{3,4}/[A-Za-z0-9-]+/(Solution\\.lean|meta\\.json|README\\.md)$") | not)) | .filename')
          [ -n "$BAD" ] && { echo "Not a pure solution PR: $BAD"; exit 0; }
          gh pr merge "$PR" -R "$R" --squash --match-head-commit "$SHA"
          gh pr comment "$PR" -R "$R" --body "✅ Verified by Lean and merged automatically. The board will update in a minute."
          gh workflow run update-site-data -R "$R"
