name: auto-merge-verified
# Runs in the base repo after verify-solution finishes. It never checks out or runs PR code.
on:
  workflow_run:
    workflows: [verify-solution]
    types: [completed]
permissions: { contents: write, pull-requests: write, actions: write }

jobs:
  merge:
    # Only the canonical verify workflow file counts (a PR that edits workflows is never auto-merged anyway).
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/verify.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Find the PR, re-check its files independently (fail closed), merge, rebuild board
        run: |
          PR=$(gh api "repos/$R/pulls?state=open&per_page=100" --jq ".[] | select(.head.sha==\"$SHA\") | .number" | head -1)
          [ -z "$PR" ] && { echo "No open PR at $SHA"; exit 0; }
          AUTHOR=$(gh api "repos/$R/pulls/$PR" --jq '.user.login')
          # Only PRs into the default branch: a PR into some other (possibly stale) branch would have been
          # checked by that branch's older checker.
          PRBASE=$(gh api "repos/$R/pulls/$PR" --jq '.base.ref')
          [ "$PRBASE" = "$DEFAULT_BRANCH" ] || { echo "PR targets $PRBASE, not $DEFAULT_BRANCH"; exit 0; }
          # Login must be a plain GitHub username before it is used inside a regex.
          echo "$AUTHOR" | grep -Eq '^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$' || { echo "Unexpected author $AUTHOR"; exit 0; }
          FILES=$(gh api --paginate "repos/$R/pulls/$PR/files?per_page=100" --jq '.[] | "\(.status) \(.filename)"')
          # Fail closed: every file must be an addition of a solution file, or an add/modify inside the
          # author's own partial-work folder. Anything else (deletions, renames, statements, data, CI) is left for a maintainer.
          ID='(QED-[ME][0-9]{3}|QED-Q[0-9]|N-000)'
          OK=1
          while read -r ST FN; do
            [ -z "$FN" ] && continue
            if [ "$ST" = "added" ] && echo "$FN" | grep -Eq "^solutions/$ID/$AUTHOR/(meta\.json|README\.md|([A-Za-z0-9][A-Za-z0-9_-]*/)*[A-Za-z0-9][A-Za-z0-9_.-]*\.lean)$"; then continue; fi
            if { [ "$ST" = "added" ] || [ "$ST" = "modified" ]; } && echo "$FN" | grep -Eq "^problems/$ID/partial/$AUTHOR/[A-Za-z0-9._-]+\.(md|txt|lean)$"; then continue; fi
            echo "Not auto-mergeable: $ST $FN"; OK=0
          done <<< "$FILES"
          [ "$OK" = 1 ] || exit 0
          [ -z "$FILES" ] && exit 0
          ok=0
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR" -R "$R" --squash --match-head-commit "$SHA"; then ok=1; break; fi
            echo "merge attempt $i failed (often another PR merged at the same moment); retrying"; sleep $((i*10))
          done
          [ "$ok" = 1 ] || exit 1
          gh pr comment "$PR" -R "$R" --body "✅ Checked and merged automatically. The board will update in a minute."
          gh workflow run update-site-data -R "$R"
