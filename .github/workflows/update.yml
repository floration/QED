name: update-site-data
on:
  push: { branches: [main] }
  issues: { types: [opened, reopened, closed, labeled] }
  issue_comment: { types: [created] }
  schedule: [ { cron: "17 6 * * *" } ]   # daily claim expiry sweep
  workflow_dispatch:
permissions: { contents: read, actions: read, issues: write, pages: write, id-token: write }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 scripts/update.py
      - run: python3 scripts/claims.py
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: mkdir -p _site && cp -r site/* _site/ && cp -r data _site/data
      - name: Render the link-preview card with live counts
        run: |
          python3 -m pip install --quiet --break-system-packages "pillow==11.*"
          python3 scripts/og_image.py _site/og.png
          # new image URL whenever the counts change, so Twitter/Discord re-fetch it
          v=$(python3 -c "import json,hashlib;print(hashlib.sha1(open('_site/og.png','rb').read()).hexdigest()[:10])")
          sed -i "s#/og.png\"#/og.png?v=$v\"#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
