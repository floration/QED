name: check-statements
on:
  pull_request: { paths: ["problems/**/Statement.lean", "lakefile.lean", "lean-toolchain"] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with: { build: false, use-mathlib-cache: true }
      - name: Typecheck every formalized statement
        run: |
          fail=0; n=0
          for f in problems/*/Statement.lean; do
            grep -q 'def Claim : Prop := sorry' "$f" && continue
            n=$((n+1))
            if ! out=$(lake env lean "$f" 2>&1) || echo "$out" | grep -q 'error'; then echo "::error file=$f::$out"; fail=1; fi
          done
          echo "checked $n statements"; exit $fail
