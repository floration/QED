name: check-statements
on:
  pull_request: { paths: ["problems/**/Statement.lean", "lakefile.lean", "lean-toolchain", "lake-manifest.json"] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and Mathlib cache
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f lake-manifest.json ]; then lake exe cache get; else lake update && lake exe cache get; fi
      - name: Typecheck every formalized statement
        run: |
          fail=0; n=0
          for f in problems/*/Statement.lean; do
            grep -q 'def Claim : Prop := sorry' "$f" && continue
            n=$((n+1))
            if ! out=$(lake env lean "$f" 2>&1) || echo "$out" | grep -q 'error'; then echo "::error file=$f::$out"; fail=1; fi
          done
          echo "checked $n statements"; exit $fail
