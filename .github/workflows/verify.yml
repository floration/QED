name: verify-solution
on: pull_request   # untrusted code: no secrets, read-only token
permissions: { contents: read }
jobs:
  verify:
    if: startsWith(github.head_ref, 'statement') == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: files
        run: echo "list=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT
      - name: Install Lean and Mathlib cache
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Check solution
        env: { PR_AUTHOR: "${{ github.event.pull_request.user.login }}" }
        run: python3 scripts/check.py ${{ steps.files.outputs.list }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: check_result, path: check_result.json }
