name: verify-solution
# Untrusted code: no secrets, read-only token. Runs for any PR touching contribution paths;
# a PR is classified by the files it changes, never by its branch name.
#
# Two jobs on two runners:
#   compile (untrusted) elaborates the contributor's Lean and hands over only an .olean;
#   verify  (trusted) never elaborates contributor Lean: it loads that .olean as data, replays every new
#           declaration through the kernel, and checks `solution` against the official statement it
#           compiles itself (scripts/qed_verify.lean). auto-merge-verified needs BOTH jobs to succeed.
on:
  pull_request:
    paths: ["solutions/**", "problems/*/partial/**"]
permissions: { contents: read }
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the base branch's checker, toolchain and dependency pins (a PR cannot change or add to them)
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          rm -rf scripts lake-manifest.json
          git checkout "origin/$BASE_REF" -- scripts lakefile.lean lean-toolchain
          git checkout "origin/$BASE_REF" -- lake-manifest.json 2>/dev/null || true
      - name: List changed files (NUL-separated; never interpolated into a script)
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: git diff -z --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed"
      - name: Install Lean and the pinned Mathlib cache
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f lake-manifest.json ]; then lake exe cache get; else lake update && lake exe cache get; fi
      - name: Check and compile contribution (untrusted)
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          BASE_REF: "${{ github.base_ref }}"
        run: python3 -I scripts/check.py --stage=compile --files-from="$RUNNER_TEMP/changed"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-output
          if-no-files-found: ignore
          path: |
            qedbuild/QEDSol.olean
            check_result.json

  verify:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the base branch's checker, toolchain and dependency pins
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          rm -rf scripts lake-manifest.json qedbuild qedtrusted
          git checkout "origin/$BASE_REF" -- scripts lakefile.lean lean-toolchain
          git checkout "origin/$BASE_REF" -- lake-manifest.json 2>/dev/null || true
      - name: List changed files
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: git diff -z --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed"
      - uses: actions/download-artifact@v4
        with: { name: compile-output, path: "${{ runner.temp }}/untrusted" }
      - name: Install Lean and the pinned Mathlib cache
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          export PATH="$HOME/.elan/bin:$PATH"
          if [ -f lake-manifest.json ]; then lake exe cache get; else lake update && lake exe cache get; fi
      - name: Verify the compiled solution against the official statement (trusted)
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          BASE_REF: "${{ github.base_ref }}"
        run: python3 -I scripts/check.py --stage=verify --olean="$RUNNER_TEMP/untrusted/qedbuild/QEDSol.olean" --files-from="$RUNNER_TEMP/changed"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: check_result, path: check_result.json }
