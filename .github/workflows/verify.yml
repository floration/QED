name: verify-solution
# Untrusted code: no secrets, read-only token. Runs for any PR touching contribution paths;
# a PR is classified by the files it changes, never by its branch name.
#
# Two jobs on two runners:
#   compile (untrusted) elaborates the contributor's Lean and hands over ONLY a text export of the compiled
#           module (lean4export NDJSON), never an .olean or anything else Lean would load;
#   verify  (trusted) never elaborates contributor Lean and never loads anything from the compile job into
#           Lean. It compiles the official statement itself, compares the export with the official
#           declarations and checks it with an independent kernel (nanoda) -- scripts/qed_trusted.py.
# auto-merge-verified needs BOTH jobs to succeed. The ruleset's required check is the job named `verify`.
on:
  pull_request:
    paths: ["solutions/**", "problems/*/partial/**"]
permissions: { contents: read }
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the base branch's checker, toolchain and dependency pins (a PR cannot change or add to them)
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          rm -rf scripts lake-manifest.json
          git checkout "origin/$BASE_REF" -- scripts lakefile.lean lean-toolchain
          git checkout "origin/$BASE_REF" -- lake-manifest.json 2>/dev/null || true
      - name: List changed files (NUL-separated; never interpolated into a script)
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: git diff -z --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed"
      - name: Install Lean, the pinned Mathlib cache and the pinned exporter
        run: bash scripts/ci_setup.sh
      - name: Check, compile and export contribution (untrusted)
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          BASE_REF: "${{ github.base_ref }}"
        run: python3 -I scripts/check.py --stage=compile --files-from="$RUNNER_TEMP/changed"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-output
          if-no-files-found: ignore
          path: |
            qedbuild/*.ndjson
            check_result.json

  verify:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Use the base branch's checker, toolchain and dependency pins
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          rm -rf scripts lake-manifest.json qedbuild qedtrusted
          git checkout "origin/$BASE_REF" -- scripts lakefile.lean lean-toolchain
          git checkout "origin/$BASE_REF" -- lake-manifest.json 2>/dev/null || true
      - name: List changed files
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: git diff -z --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed"
      - uses: actions/download-artifact@v4
        with: { name: compile-output, path: "${{ runner.temp }}/untrusted" }
      - name: Install Lean, the pinned Mathlib cache, the pinned exporter and the pinned independent kernel
        run: bash scripts/ci_setup.sh --nanoda
      - name: Verify the exported solution against the official statement (trusted)
        env:
          PR_AUTHOR: "${{ github.event.pull_request.user.login }}"
          BASE_REF: "${{ github.base_ref }}"
        run: python3 -I scripts/check.py --stage=verify --untrusted="$RUNNER_TEMP/untrusted" --files-from="$RUNNER_TEMP/changed"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: check_result, path: check_result.json }
