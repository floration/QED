name: verifier-selftest
# Regression test for the solution verifier. verify.yml always takes its checker from the BASE branch, so a PR
# that changes the checker cannot test itself there; this workflow runs the checker FROM THIS COMMIT on the
# fixtures in tests/verifier/cases/ (genuine solutions and partial work that must pass, attacks that must fail)
# and on every merged solution, with the same split as verify.yml: untrusted compile -> text export -> trusted
# verify. Read-only token, no secrets, nothing is written back to the repository. The job names deliberately
# differ from verify.yml's `verify` (the ruleset's required check), so this workflow can never stand in for it.
on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/**", "tests/verifier/**"]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: verifier-selftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  selftest-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Install Lean, the pinned Mathlib cache and the pinned exporter
        run: bash scripts/ci_setup.sh
      - name: Compile and export every case (untrusted stage)
        run: python3 -I tests/verifier/selftest.py compile "$RUNNER_TEMP/selftest-out"
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-exports
          path: ${{ runner.temp }}/selftest-out
          if-no-files-found: error
          retention-days: 3

  selftest-verify:
    needs: selftest-compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { name: selftest-exports, path: "${{ runner.temp }}/selftest-in" }
      - name: Install Lean, the pinned Mathlib cache, the pinned exporter and the pinned independent kernel
        run: bash scripts/ci_setup.sh --nanoda
      - name: Verify every case (trusted stage) and check expectations
        run: python3 -I tests/verifier/selftest.py verify "$RUNNER_TEMP/selftest-in"
