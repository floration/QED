name: pin-dependencies
# Run manually to (re)generate lake-manifest.json, which pins Mathlib and every transitive
# dependency to exact commits. CI then builds against exactly these versions (no `lake update`).
on: { workflow_dispatch: {} }
permissions: { contents: write, pull-requests: write }
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          sha256sum lake-manifest.json
      - name: Open a PR with the manifest
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          B="pin-deps-${{ github.run_id }}"
          git checkout -b "$B"; git add lake-manifest.json
          git diff --cached --quiet && { echo "Manifest unchanged"; exit 0; }
          git commit -m "Pin Lean dependencies (lake-manifest.json)"
          git push origin "$B"
          gh pr create --base main --head "$B" --title "Pin Lean dependencies" --body "Generated by the pin-dependencies workflow."
