name: label-claims
on: { issues: { types: [opened] } }
permissions: { issues: write }
jobs:
  label:
    if: startsWith(github.event.issue.title, 'Claim ')
    runs-on: ubuntu-latest
    steps:
      - run: gh issue edit ${{ github.event.issue.number }} -R ${{ github.repository }} --add-label claim
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
